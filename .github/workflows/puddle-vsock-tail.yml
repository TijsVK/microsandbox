# puddle fork: tail loss on Unix-socket vsock routes (microsandbox#1753 and its guest-to-host
# mirror) on a hosted Linux runner with KVM (puddle T-155). Fork-only file; it gates nothing.
#
# Builds msb for Linux from this commit (optionally against another TijsVK/libkrun commit) and runs
# tests/puddle/vsock-tail.sh against it in a real microVM. The same cases also run against
# upstream's stock release as a control (msb_krun 0.1.40 on v0.7.7: no libkrun #152).
#
# A libkrun change can also be tried by pushing a vsock-tail/<name> branch whose Cargo.toml and
# Cargo.lock point at it.
#
#   gh workflow run puddle-vsock-tail.yml -R TijsVK/microsandbox --ref <branch> \
#     [-f libkrun_rev=<sha>] [-f stock_tag=v0.7.7] [-f cases='h2g-close 1000 1048576']
name: puddle vsock tail

on:
  # On `puddle` (and vsock-tail/* experiment branches): when the test or the lock (a libkrun bump)
  # changes.
  push:
    branches:
      - puddle
      - vsock-tail/**
    paths:
      - .github/workflows/puddle-vsock-tail.yml
      - tests/puddle/vsock-tail.*
      - Cargo.lock
  workflow_dispatch:
    inputs:
      libkrun_rev:
        description: "TijsVK/libkrun commit to build against instead of Cargo.lock's (empty: the lock)"
        required: false
        default: ""
        type: string
      stock_tag:
        description: "Upstream release for the control run (empty: no control)"
        required: false
        default: v0.7.7
        type: string
      cases:
        description: "Cases, one per line or separated by ';' (empty: vsock-tail.sh's list)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  UPSTREAM_REPO: superradcompany/microsandbox

jobs:
  build:
    name: Build msb (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upstream release of this fork version
        id: up
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "tag=v${version%%-puddle.*}" >> "$GITHUB_OUTPUT"
          echo "fork version $version, upstream v${version%%-puddle.*}"

      - name: agentd + libkrunfw from upstream ${{ steps.up.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$UPSTREAM_REPO" -D dl \
            -p checksums.sha256 -p agentd-x86_64 -p libkrunfw-linux-x86_64.so
          bash .github/puddle/verify-asset.sh dl/checksums.sha256 dl/agentd-x86_64 agentd-x86_64
          bash .github/puddle/verify-asset.sh dl/checksums.sha256 dl/libkrunfw-linux-x86_64.so libkrunfw-linux-x86_64.so
          mkdir -p embed
          cp dl/agentd-x86_64 embed/agentd

      - name: Point the build at libkrun ${{ inputs.libkrun_rev }}
        if: ${{ inputs.libkrun_rev != '' }}
        env:
          REV: ${{ inputs.libkrun_rev }}
        run: |
          set -euo pipefail
          [[ "$REV" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::libkrun_rev must be a commit sha"; exit 1; }
          sed -i "s|git = \"https://github.com/TijsVK/libkrun\", branch = \"puddle\"|git = \"https://github.com/TijsVK/libkrun\", rev = \"$REV\"|" Cargo.toml
          grep -c "rev = \"$REV\"" Cargo.toml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          shared-key: puddle-msb-linux

      - name: Build msb
        env:
          REV: ${{ inputs.libkrun_rev }}
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q libcap-ng-dev
          locked=--locked
          [ -z "$REV" ] || locked=
          MSB_EMBED_ARTIFACTS_DIR="$PWD/embed" cargo build $locked --release --no-default-features \
            --features embed-binaries,net,ssh -p microsandbox-cli
          grep -m1 -A2 'name = "msb_krun_devices"' Cargo.lock
          fw=$(sed -n 's/.*LIBKRUNFW_VERSION: &str = "\(.*\)";/\1/p' crates/utils/lib/lib.rs)
          mkdir -p rt
          cp target/release/msb rt/msb
          cp dl/libkrunfw-linux-x86_64.so "rt/libkrunfw.so.$fw"
          ./rt/msb --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msb-linux
          path: rt/
          compression-level: 1

  tail:
    name: vsock tail (${{ matrix.runtime }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [fork, stock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tests/puddle
            .github/puddle

      - name: KVM
        id: kvm
        env:
          EVENT: ${{ github.event_name }}
          INPUT_STOCK: ${{ inputs.stock_tag }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          # A push runs the control against v0.7.7; a dispatch with an empty stock_tag skips it.
          stock=v0.7.7
          [ "$EVENT" != workflow_dispatch ] || stock=$INPUT_STOCK
          echo "stock_tag=$stock" >> "$GITHUB_OUTPUT"
          if [ "$RUNTIME" = stock ] && [ -z "$stock" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "no control run requested"; exit 0
          fi
          [ -e /dev/kvm ] || { echo "::error::/dev/kvm is missing on this runner (infrastructure)"; exit 1; }
          # Hosted runners ship /dev/kvm root-only; open it to the runner user.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ matrix.runtime == 'fork' }}
        with:
          name: msb-linux
          path: rt

      - name: Stock runtime ${{ steps.kvm.outputs.stock_tag }}
        if: ${{ matrix.runtime == 'stock' && steps.kvm.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.kvm.outputs.stock_tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$UPSTREAM_REPO" -D dl \
            -p checksums.sha256 -p msb-linux-x86_64 -p libkrunfw-linux-x86_64.so
          bash .github/puddle/verify-asset.sh dl/checksums.sha256 dl/msb-linux-x86_64 msb-linux-x86_64
          bash .github/puddle/verify-asset.sh dl/checksums.sha256 dl/libkrunfw-linux-x86_64.so libkrunfw-linux-x86_64.so
          # msb looks for libkrunfw.so.<LIBKRUNFW_VERSION of its source> beside itself.
          fw=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$UPSTREAM_REPO/contents/crates/utils/lib/lib.rs?ref=$TAG" \
            | sed -n 's/.*LIBKRUNFW_VERSION: &str = "\(.*\)";/\1/p')
          [ -n "$fw" ] || { echo "::error::no LIBKRUNFW_VERSION in $TAG"; exit 1; }
          mkdir -p rt
          cp dl/msb-linux-x86_64 rt/msb
          cp dl/libkrunfw-linux-x86_64.so "rt/libkrunfw.so.$fw"
          chmod +x rt/msb
          ls -l rt

      - name: Run the cases
        if: ${{ steps.kvm.outputs.run == 'true' }}
        env:
          CASES: ${{ inputs.cases }}
          VSOCK_TAIL_NAME: tail-${{ matrix.runtime }}
        run: |
          set -uo pipefail
          chmod +x rt/msb
          cases=()
          if [ -n "$CASES" ]; then
            printf '%s\n' "$CASES" | tr ';' '\n' > "$RUNNER_TEMP/cases"
            cases=("$RUNNER_TEMP/cases")
          fi
          bash tests/puddle/vsock-tail.sh rt "$RUNNER_TEMP/w" "${cases[@]}" 2>&1 | tee "$RUNNER_TEMP/tail.log"
          code=${PIPESTATUS[0]}
          echo "vsock-tail.sh exit $code"
          if [ "${{ matrix.runtime }}" = stock ]; then
            # The control reports; only a setup failure fails it.
            [ "$code" -ne 2 ] || exit 1
            exit 0
          fi
          exit "$code"

      - name: Keep logs
        if: ${{ !cancelled() && steps.kvm.outputs.run == 'true' }}
        run: |
          mkdir -p keep
          cp "$RUNNER_TEMP/tail.log" "$RUNNER_TEMP"/w/*.log "$RUNNER_TEMP"/w/*.jsonl keep/ 2>/dev/null || true
          find "$RUNNER_TEMP/w/home" -path '*/logs/*' -name '*.log' -exec cp --parents {} keep/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.kvm.outputs.run == 'true' }}
        with:
          name: vsock-tail-${{ matrix.runtime }}
          path: keep/
